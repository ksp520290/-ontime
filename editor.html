<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runtime Board — 進行表エディタ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div id="nav-mount"></div>

  <main>
    <div class="container">

      <div class="toolbar">
        <button class="primary" id="btn-add-event">＋ イベントを追加</button>
        <button id="btn-add-block">＋ 見出し（ブロック）を追加</button>
        <div class="spacer"></div>
        <span class="badge"><span class="dot"></span><span id="hdr-total">合計 00:00</span></span>
      </div>

      <div class="panel">
        <table class="rundown">
          <thead>
            <tr>
              <th style="width:26px;"></th>
              <th style="width:56px;">キュー</th>
              <th style="width:18px;">色</th>
              <th>タイトル / 副題</th>
              <th style="width:130px;">出演・担当</th>
              <th style="width:200px;">メモ</th>
              <th style="width:90px;">所要時間</th>
              <th style="width:70px;">開始</th>
              <th style="width:70px;">終了</th>
              <th style="width:120px;"></th>
            </tr>
          </thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty-hint" id="empty-hint" style="display:none;">
          イベントがまだありません。「＋ イベントを追加」から作成するか、ホーム画面からサンプル進行表を読み込んでください。
        </div>
      </div>

      <p class="footer-note">所要時間は「分:秒」（例 3:30）または秒数で入力できます。開始・終了時刻は自動計算されます。</p>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/timer-engine.js"></script>
<script src="js/nav.js"></script>
<script src="js/util.js"></script>
<script>
  const { Store, Timer } = RB;
  const { toast, escapeHtml, parseMMSS, debounce } = RB.Util;

  RB.Nav.renderTopbar(document.getElementById("nav-mount"));

  const rowsEl = document.getElementById("rows");
  const emptyHint = document.getElementById("empty-hint");

  function fieldUpdate(id, key, value) {
    Store.update((s) => {
      const ev = s.events.find((e) => e.id === id);
      if (ev) ev[key] = value;
    });
  }

  function render(state) {
    const schedule = Timer.buildSchedule(state);
    const total = Timer.totalRuntime(state);
    document.getElementById("hdr-total").textContent =
      "合計 " + Timer.formatSeconds(total, { forceHours: total >= 3600 });

    emptyHint.style.display = state.events.length ? "none" : "block";

    rowsEl.innerHTML = state.events
      .map((e, idx) => {
        if (e.type === "block") {
          return `
            <tr class="block-row" data-id="${e.id}">
              <td colspan="6">
                <input type="text" class="block-title" data-id="${e.id}" value="${escapeHtml(e.title)}" placeholder="見出し" style="background:transparent;border:none;color:inherit;font-weight:600;width:100%;" />
              </td>
              <td colspan="2"></td>
              <td>
                <button class="icon-btn" data-act="up" data-id="${e.id}" title="上へ">▲</button>
                <button class="icon-btn" data-act="down" data-id="${e.id}" title="下へ">▼</button>
                <button class="icon-btn warn" data-act="del" data-id="${e.id}" title="削除">✕</button>
              </td>
            </tr>`;
        }
        const sch = schedule.get(e.id);
        return `
          <tr class="event-row ${e.skip ? "skipped" : ""}" data-id="${e.id}">
            <td class="mono" style="color:var(--text-2);font-size:11px;">${idx + 1}</td>
            <td><input type="text" class="cue-tag" data-field="cue" data-id="${e.id}" value="${escapeHtml(e.cue)}" placeholder="—" /></td>
            <td><input type="color" data-field="colour" data-id="${e.id}" value="${e.colour || "#58a6ff"}" /></td>
            <td>
              <input type="text" data-field="title" data-id="${e.id}" value="${escapeHtml(e.title)}" placeholder="タイトル" style="font-weight:600;margin-bottom:2px;" />
              <input type="text" data-field="subtitle" data-id="${e.id}" value="${escapeHtml(e.subtitle)}" placeholder="副題（任意）" style="font-size:11.5px;color:var(--text-2);" />
            </td>
            <td><input type="text" data-field="presenter" data-id="${e.id}" value="${escapeHtml(e.presenter)}" placeholder="—" /></td>
            <td><input type="text" data-field="note" data-id="${e.id}" value="${escapeHtml(e.note)}" placeholder="—" /></td>
            <td><input type="text" class="mono" data-field="duration" data-id="${e.id}" value="${Timer.formatSeconds(e.duration)}" /></td>
            <td class="mono" style="font-size:12px;color:var(--text-1);">${Timer.formatClock(sch.start)}</td>
            <td class="mono" style="font-size:12px;color:var(--text-1);">${Timer.formatClock(sch.end)}</td>
            <td>
              <button class="icon-btn" data-act="skip" data-id="${e.id}" title="${e.skip ? "スキップ解除" : "スキップ"}">${e.skip ? "👁" : "🚫"}</button>
              <button class="icon-btn" data-act="up" data-id="${e.id}" title="上へ">▲</button>
              <button class="icon-btn" data-act="down" data-id="${e.id}" title="下へ">▼</button>
              <button class="icon-btn warn" data-act="del" data-id="${e.id}" title="削除">✕</button>
            </td>
          </tr>`;
      })
      .join("");
  }

  Store.subscribe(render);

  // テキスト系フィールドの入力（デバウンスして保存）
  const debouncedText = debounce((id, field, value) => fieldUpdate(id, field, value), 250);

  rowsEl.addEventListener("input", (ev) => {
    const t = ev.target;
    const id = t.dataset.id;
    if (t.classList.contains("block-title")) {
      debouncedText(id, "title", t.value);
      return;
    }
    const field = t.dataset.field;
    if (!field) return;
    if (field === "colour") {
      fieldUpdate(id, "colour", t.value);
    } else if (field === "duration") {
      // 見た目はそのまま、確定時（change）に秒数変換
    } else {
      debouncedText(id, field, t.value);
    }
  });

  rowsEl.addEventListener("change", (ev) => {
    const t = ev.target;
    if (t.dataset.field === "duration") {
      const seconds = parseMMSS(t.value);
      fieldUpdate(t.dataset.id, "duration", seconds);
    }
  });

  rowsEl.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (!btn) return;
    const id = btn.dataset.id;
    const act = btn.dataset.act;

    Store.update((s) => {
      const idx = s.events.findIndex((e) => e.id === id);
      if (idx === -1) return;
      if (act === "del") {
        if (!confirm("このイベントを削除しますか？")) return;
        s.events.splice(idx, 1);
        if (s.playback.loadedId === id) {
          s.playback.loadedId = null;
          s.playback.state = "stop";
        }
      } else if (act === "up" && idx > 0) {
        [s.events[idx - 1], s.events[idx]] = [s.events[idx], s.events[idx - 1]];
      } else if (act === "down" && idx < s.events.length - 1) {
        [s.events[idx + 1], s.events[idx]] = [s.events[idx], s.events[idx + 1]];
      } else if (act === "skip") {
        s.events[idx].skip = !s.events[idx].skip;
      }
    });
  });

  document.getElementById("btn-add-event").addEventListener("click", () => {
    Store.update((s) => {
      s.events.push({
        id: Store.uid(),
        type: "event",
        cue: "",
        title: "新しいイベント",
        subtitle: "",
        presenter: "",
        note: "",
        duration: 300,
        colour: "#58a6ff",
        skip: false,
      });
    });
    toast("イベントを追加しました");
  });

  document.getElementById("btn-add-block").addEventListener("click", () => {
    Store.update((s) => {
      s.events.push({
        id: Store.uid(),
        type: "block",
        cue: "",
        title: "新しい見出し",
        subtitle: "",
        presenter: "",
        note: "",
        duration: 0,
        colour: "",
        skip: false,
      });
    });
  });
</script>
</body>
</html>
