<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runtime Board — 進行表エディタ</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div id="nav-mount"></div>

  <main>
    <div class="container" id="page-content">

      <div class="tab-select" id="tab-select">
        <button class="active" disabled title="常に表示されます">基本</button>
        <button data-tab="kamite">上手</button>
        <button data-tab="shimote">下手</button>
        <button data-tab="lighting">照明</button>
        <button data-tab="sound">音響</button>
      </div>

      <div class="tech-toolbar" id="lighting-toolbar" style="display:none;">
        <span class="group-label">照明:</span>
        <button class="toggle-btn tgl-violet" data-light="intermission">幕間</button>
        <button class="toggle-btn tgl-blue" data-light="arena">アリーナ</button>
        <button class="toggle-btn tgl-amber" data-light="worklight">作業灯</button>
      </div>
      <div class="tech-toolbar" id="sound-toolbar" style="display:none;">
        <span class="group-label">音響:</span>
        <button class="toggle-btn tgl-red" id="btn-mc-mic">司会</button>
      </div>

      <div class="toolbar">
        <button class="primary" id="btn-add-event">＋ イベントを追加（司会を自動挿入）</button>
        <button id="btn-add-block">＋ 見出し（ブロック）を追加</button>
        <div class="spacer"></div>
        <button id="btn-print">🖨 印刷</button>
        <span class="badge"><span class="dot"></span><span id="hdr-total">合計 00:00</span></span>
      </div>

      <div class="panel">
        <table class="rundown" id="rundown-table">
          <thead><tr id="head-row"></tr></thead>
          <tbody id="rows"></tbody>
        </table>
        <div class="empty-hint" id="empty-hint" style="display:none;">
          イベントがまだありません。「＋ イベントを追加」から作成するか、ホーム画面からサンプル進行表を読み込んでください。
        </div>
      </div>

      <p class="footer-note">
        所要時間は「分:秒」（例 3:30）または秒数で入力できます。イベントを追加すると、直後に「司会（つなぎ）」が自動で挿入されます。
        キュー番号はイベントにのみ自動採番されます。
      </p>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/timer-engine.js"></script>
<script src="js/sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/rundown-render.js"></script>
<script src="js/util.js"></script>
<script>
  const { Store, Timer, Rundown } = RB;
  const { toast, parseMMSS, debounce } = RB.Util;

  RB.Nav.renderTopbar(document.getElementById("nav-mount"));
  if (RB.Nav.guardProductionMode(false)) {
    document.getElementById("page-content").style.display = "none";
  } else {
    const rowsEl = document.getElementById("rows");
    const headRow = document.getElementById("head-row");
    const emptyHint = document.getElementById("empty-hint");
    const tapOpenIds = new Set();

    const tabs = { kamite: false, shimote: false, lighting: false, sound: false };

    document.querySelectorAll("#tab-select button[data-tab]").forEach((btn) => {
      btn.addEventListener("click", () => {
        const key = btn.dataset.tab;
        tabs[key] = !tabs[key];
        btn.classList.toggle("active", tabs[key]);
        document.getElementById("lighting-toolbar").style.display = tabs.lighting ? "flex" : "none";
        document.getElementById("sound-toolbar").style.display = tabs.sound ? "flex" : "none";
        render(Store.getState());
      });
    });

    function fieldUpdate(id, key, value) {
      Store.update((s) => {
        const ev = s.events.find((e) => e.id === id);
        if (ev) ev[key] = value;
      });
    }

    function render(state) {
      headRow.innerHTML = Rundown.techHeaderCells(tabs, true);

      const schedule = Timer.buildSchedule(state);
      const cueMap = Timer.buildCueNumbers(state);
      const total = Timer.totalRuntime(state);
      document.getElementById("hdr-total").textContent = "合計 " + Timer.formatSeconds(total, { forceHours: total >= 3600 });
      emptyHint.style.display = state.events.length ? "none" : "block";

      rowsEl.innerHTML = state.events
        .map((e, idx) =>
          Rundown.renderFullRow(e, idx, {
            schedule,
            cueMap,
            editable: true,
            tabs,
            currentId: state.playback.loadedId,
            tapOpenIds,
          })
        )
        .join("");

      document.getElementById("btn-mc-mic").classList.toggle("active", !!state.sound.mcMic);
      document.getElementById("lighting-toolbar").querySelectorAll("[data-light]").forEach((b) => {
        b.classList.toggle("active", !!state.lighting[b.dataset.light]);
      });
    }

    Store.subscribe(render);

    const debouncedText = debounce((id, field, value) => fieldUpdate(id, field, value), 250);
    const debouncedMemo = debounce((id, field, value) => fieldUpdate(id, field, value), 300);

    rowsEl.addEventListener("input", (ev) => {
      const t = ev.target;
      const id = t.dataset.id;
      if (t.classList.contains("block-title")) {
        debouncedText(id, "title", t.value);
        return;
      }
      if (t.dataset.memoField) {
        debouncedMemo(id, t.dataset.memoField, t.value);
        return;
      }
      const field = t.dataset.field;
      if (!field) return;
      if (field === "colour") fieldUpdate(id, "colour", t.value);
      else if (field === "duration") {
        /* change 時に変換 */
      } else debouncedText(id, field, t.value);
    });

    rowsEl.addEventListener("change", (ev) => {
      const t = ev.target;
      if (t.dataset.field === "duration") {
        fieldUpdate(t.dataset.id, "duration", parseMMSS(t.value));
      }
    });

    rowsEl.addEventListener("click", (ev) => {
      const memoOpen = ev.target.closest("[data-memo-open]");
      if (memoOpen) {
        tapOpenIds.add(memoOpen.dataset.memoOpen);
        render(Store.getState());
        return;
      }
      const curtainBtn = ev.target.closest("[data-curtain]");
      if (curtainBtn) {
        fieldUpdate(curtainBtn.dataset.id, "curtain", curtainBtn.dataset.curtain);
        return;
      }
      const btn = ev.target.closest("button[data-act]");
      if (!btn) return;
      const id = btn.dataset.id;
      const act = btn.dataset.act;
      Store.update((s) => {
        const idx = s.events.findIndex((e) => e.id === id);
        if (idx === -1) return;
        if (act === "del") {
          if (!confirm("この行を削除しますか？")) return;
          s.events.splice(idx, 1);
          if (s.playback.loadedId === id) {
            s.playback.loadedId = null;
            s.playback.state = "stop";
          }
        } else if (act === "up" && idx > 0) {
          [s.events[idx - 1], s.events[idx]] = [s.events[idx], s.events[idx - 1]];
        } else if (act === "down" && idx < s.events.length - 1) {
          [s.events[idx + 1], s.events[idx]] = [s.events[idx], s.events[idx + 1]];
        } else if (act === "skip") {
          s.events[idx].skip = !s.events[idx].skip;
        }
      });
    });

    // フォーカスが外れたら memo セルを閉じる（現在再生中の行は常に開いたまま）
    rowsEl.addEventListener(
      "focusout",
      (ev) => {
        const ta = ev.target;
        if (!ta.dataset || !ta.dataset.memoField) return;
        const key = ta.dataset.id + ":" + ta.dataset.memoField;
        setTimeout(() => {
          tapOpenIds.delete(key);
          render(Store.getState());
        }, 150);
      },
      true
    );

    document.getElementById("btn-add-event").addEventListener("click", () => {
      Store.addEventWithMc();
      toast("イベントと司会を追加しました");
    });
    document.getElementById("btn-add-block").addEventListener("click", () => Store.addBlock());
    document.getElementById("btn-print").addEventListener("click", () => window.print());

    document.getElementById("lighting-toolbar").addEventListener("click", (ev) => {
      const b = ev.target.closest("[data-light]");
      if (!b) return;
      Store.update((s) => (s.lighting[b.dataset.light] = !s.lighting[b.dataset.light]));
    });
    document.getElementById("btn-mc-mic").addEventListener("click", () => {
      Store.update((s) => (s.sound.mcMic = !s.sound.mcMic));
    });
  }
</script>
</body>
</html>
