<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Runtime Board — オペレーター</title>
<link rel="stylesheet" href="css/style.css" />
</head>
<body>
<div class="app">
  <div id="nav-mount"></div>

  <main>
    <div class="container">
      <div class="operator-layout">

        <!-- 左: 現在の進行タイマー -->
        <div>
          <div class="now-panel">
            <div class="row" style="justify-content:center;margin-bottom:8px;">
              <span class="badge" id="pb-badge"><span class="dot"></span><span id="pb-badge-text">停止中</span></span>
            </div>
            <div class="stage" id="now-cue">CUE —</div>
            <div class="title" id="now-title">イベントが選択されていません</div>
            <div class="subtitle" id="now-sub">&nbsp;</div>

            <div class="big-timer idle" id="big-timer">00:00</div>
            <div class="timer-sub" id="timer-sub">所要時間 —</div>

            <div class="transport">
              <button class="ghost" id="btn-prev">◀ 前へ</button>
              <button class="go" id="btn-play">▶ 再生</button>
              <button id="btn-pause">⏸ 一時停止</button>
              <button class="stop" id="btn-stop">■ 停止</button>
              <button class="ghost" id="btn-next">次へ ▶</button>
            </div>
            <div class="addtime-row">
              <button id="t-minus-60">-1分</button>
              <button id="t-minus-10">-10秒</button>
              <button id="t-plus-10">+10秒</button>
              <button id="t-plus-60">+1分</button>
            </div>

            <div class="next-preview" id="next-preview">次: —</div>
          </div>

          <div class="row" style="justify-content:center;">
            <div class="offset-badge flat" id="offset-badge">
              <span>⏱</span><span class="val" id="offset-val">±0</span><span id="offset-label">定刻どおり</span>
            </div>
          </div>

          <div class="panel" style="margin-top:6px;">
            <div class="panel-head"><h2>ステージ・バックステージへのメッセージ</h2></div>
            <div class="panel-body">
              <div class="field">
                <textarea id="msg-text" rows="2" placeholder="表示するメッセージを入力…"></textarea>
              </div>
              <div class="row">
                <select id="msg-level">
                  <option value="normal">通常</option>
                  <option value="warn">注意（黄）</option>
                  <option value="danger">警告（赤）</option>
                </select>
                <button class="primary" id="btn-msg-send">表示する</button>
                <button class="ghost" id="btn-msg-clear">非表示にする</button>
              </div>
            </div>
          </div>
        </div>

        <!-- 右: キューシート -->
        <div class="panel">
          <div class="panel-head"><h2>キューシート（司会を含む全項目）</h2></div>
          <table class="rundown">
            <thead>
              <tr>
                <th style="width:26px;">キュー</th>
                <th style="width:16px;"></th>
                <th>タイトル / 副題</th>
                <th style="width:100px;">出演</th>
                <th style="width:130px;">メモ</th>
                <th style="width:60px;">時間</th>
                <th style="width:56px;">開始</th>
                <th style="width:56px;">終了</th>
                <th style="width:140px;"></th>
              </tr>
            </thead>
            <tbody id="cue-rows"></tbody>
          </table>
          <div class="empty-hint" id="empty-hint" style="display:none;">
            進行表がありません。先に進行表エディタでイベントを作成してください。
          </div>
        </div>

      </div>
    </div>
  </main>
</div>

<script src="js/storage.js"></script>
<script src="js/timer-engine.js"></script>
<script src="js/sync.js"></script>
<script src="js/nav.js"></script>
<script src="js/rundown-render.js"></script>
<script src="js/util.js"></script>
<script>
  const { Store, Timer, Rundown } = RB;
  const { escapeHtml } = RB.Util;

  RB.Nav.renderTopbar(document.getElementById("nav-mount"));

  const cueRows = document.getElementById("cue-rows");
  const emptyHint = document.getElementById("empty-hint");

  function renderCueSheet(state) {
    const schedule = Timer.buildSchedule(state);
    const cueMap = Timer.buildCueNumbers(state);
    const playable = Timer.playableEvents(state);
    emptyHint.style.display = playable.length ? "none" : "block";

    cueRows.innerHTML = state.events
      .map((e, idx) => {
        const row = Rundown.renderFullRow(e, idx, {
          schedule,
          cueMap,
          editable: false,
          showActions: true,
          tabs: {},
          currentId: state.playback.loadedId,
          tapOpenIds: new Set(),
        });
        if (e.type === "block") return row;
        const status = state.playback.loadedId === e.id ? (state.playback.state === "play" ? "playing" : "loaded") : "";
        return row.replace('class="event-row', `class="event-row ${status}`).replace(
          "</td></tr>",
          `</td>
            <div class="row" style="justify-content:flex-end;gap:4px;margin-top:2px;">
              <button class="icon-btn" data-act="load" data-id="${e.id}" title="ロード">⏏</button>
              <button class="icon-btn" data-act="playnow" data-id="${e.id}" title="このキューから再生">▶</button>
            </div>
          </td></tr>`
        );
      })
      .join("");
  }

  function updateTimerDisplay(state) {
    const timing = Timer.computeTiming(state);
    const cueMap = Timer.buildCueNumbers(state);
    const badgeText = { stop: "停止中", play: "オンエア", pause: "一時停止中" }[state.playback.state];
    document.getElementById("pb-badge-text").textContent = badgeText;
    document.getElementById("pb-badge").classList.toggle("on-air", state.playback.state === "play");

    const bigTimer = document.getElementById("big-timer");
    const sub = document.getElementById("timer-sub");

    if (!timing.event) {
      document.getElementById("now-cue").textContent = "CUE —";
      document.getElementById("now-title").textContent = "イベントが選択されていません";
      document.getElementById("now-sub").innerHTML = "&nbsp;";
      bigTimer.textContent = "00:00";
      bigTimer.className = "big-timer idle";
      sub.textContent = "所要時間 —";
    } else {
      const cue = timing.event.type === "mc" ? "-" : cueMap.get(timing.event.id) || "—";
      document.getElementById("now-cue").textContent = "CUE " + cue;
      document.getElementById("now-title").textContent = timing.event.title || "（無題）";
      document.getElementById("now-sub").textContent = timing.event.subtitle || timing.event.presenter || "\u00A0";

      bigTimer.textContent = Timer.formatSeconds(timing.remaining, { forceHours: timing.duration >= 3600 });
      bigTimer.className =
        "big-timer " +
        (state.playback.state === "stop" ? "idle" : timing.overtime ? "danger" : timing.remaining < 30 ? "warn" : "");
      sub.textContent = "所要時間 " + Timer.formatSeconds(timing.duration);
    }

    const nxt = Timer.nextPlayable(state, state.playback.loadedId);
    document.getElementById("next-preview").innerHTML = nxt
      ? `次: <b>${escapeHtml(nxt.title)}</b>　${Timer.formatSeconds(nxt.duration)}`
      : "次: —（進行表の終端です）";

    document.getElementById("btn-play").disabled = state.playback.state === "play";
    document.getElementById("btn-pause").disabled = state.playback.state !== "play";

    // 押し / 巻き
    const offsetSec = Timer.currentShowOffset(state);
    const fo = Timer.formatOffset(offsetSec);
    const badge = document.getElementById("offset-badge");
    badge.className = "offset-badge " + fo.cls;
    document.getElementById("offset-val").textContent = fo.text;
    document.getElementById("offset-label").textContent = fo.label;
  }

  function render(state) {
    renderCueSheet(state);
    updateTimerDisplay(state);
  }

  Store.subscribe(render);
  setInterval(() => updateTimerDisplay(Store.getState()), 250);

  cueRows.addEventListener("click", (ev) => {
    const btn = ev.target.closest("button[data-act]");
    if (btn) {
      const id = btn.dataset.id;
      if (btn.dataset.act === "load") Store.update((s) => Timer.loadEvent(s, id));
      if (btn.dataset.act === "playnow") Store.update((s) => Timer.playEvent(s, id));
      if (btn.dataset.act === "skip")
        Store.update((s) => {
          const e = s.events.find((x) => x.id === id);
          if (e) e.skip = !e.skip;
        });
      if (btn.dataset.act === "del") {
        if (confirm("この行を削除しますか？")) {
          Store.update((s) => {
            s.events = s.events.filter((x) => x.id !== id);
            if (s.playback.loadedId === id) {
              s.playback.loadedId = null;
              s.playback.state = "stop";
            }
          });
        }
      }
      if (btn.dataset.act === "up" || btn.dataset.act === "down") {
        Store.update((s) => {
          const idx = s.events.findIndex((x) => x.id === id);
          if (btn.dataset.act === "up" && idx > 0) [s.events[idx - 1], s.events[idx]] = [s.events[idx], s.events[idx - 1]];
          if (btn.dataset.act === "down" && idx < s.events.length - 1)
            [s.events[idx + 1], s.events[idx]] = [s.events[idx], s.events[idx + 1]];
        });
      }
    }
  });

  document.getElementById("btn-play").addEventListener("click", () => Store.update((s) => Timer.play(s)));
  document.getElementById("btn-pause").addEventListener("click", () => Store.update((s) => Timer.pause(s)));
  document.getElementById("btn-stop").addEventListener("click", () => Store.update((s) => Timer.stop(s)));
  document.getElementById("btn-next").addEventListener("click", () => Store.update((s) => Timer.advance(s)));
  document.getElementById("btn-prev").addEventListener("click", () => {
    Store.update((s) => {
      const playable = Timer.playableEvents(s).filter((e) => !e.skip);
      const idx = playable.findIndex((e) => e.id === s.playback.loadedId);
      const prev = idx > 0 ? playable[idx - 1] : playable[0];
      if (prev) Timer.loadEvent(s, prev.id);
    });
  });

  document.getElementById("t-minus-60").addEventListener("click", () => Store.update((s) => Timer.addTime(s, -60)));
  document.getElementById("t-minus-10").addEventListener("click", () => Store.update((s) => Timer.addTime(s, -10)));
  document.getElementById("t-plus-10").addEventListener("click", () => Store.update((s) => Timer.addTime(s, 10)));
  document.getElementById("t-plus-60").addEventListener("click", () => Store.update((s) => Timer.addTime(s, 60)));

  const msgText = document.getElementById("msg-text");
  const msgLevel = document.getElementById("msg-level");

  Store.subscribe((state) => {
    if (document.activeElement !== msgText) msgText.value = state.message.text;
    msgLevel.value = state.message.level;
  });

  document.getElementById("btn-msg-send").addEventListener("click", () => {
    Store.update((s) => {
      s.message.text = msgText.value;
      s.message.level = msgLevel.value;
      s.message.visible = true;
    });
  });
  document.getElementById("btn-msg-clear").addEventListener("click", () => {
    Store.update((s) => (s.message.visible = false));
  });
</script>
</body>
</html>
